<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4"/>
      <stop offset="100%" stop-color="#EFECE4"/>
    </linearGradient>
    <linearGradient id="silkFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#E8E1D5"/>
    </linearGradient>
    <linearGradient id="silverShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
  </defs>

  <!-- Background Warm Canvas Plate -->
  <rect width="600" height="600" fill="url(#bgGlow)"/>
  <rect x="20" y="20" width="560" height="560" rx="24" fill="none" stroke="#D8B454" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Vietnamese Tile Geometric Motif Accent -->
  <g opacity="0.15" stroke="#456B56" stroke-width="1.5" fill="none">
    <circle cx="300" cy="300" r="180"/>
    <rect x="210" y="210" width="180" height="180" transform="rotate(45 300 300)"/>
  </g>

  <!-- Stylized Áo Cóm Thái Trắng Garment Drawing -->
  <g transform="translate(0, 30)">
    <!-- Flared Sleeves -->
    <path d="M 170 170 L 90 290 L 130 320 L 220 220 Z" fill="url(#silkFabric)" stroke="#365544" stroke-width="2"/>
    <path d="M 430 170 L 510 290 L 470 320 L 380 220 Z" fill="url(#silkFabric)" stroke="#365544" stroke-width="2"/>
    
    <!-- Torso Shape Fitted -->
    <path d="M 220 160 Q 300 210 380 160 L 370 390 Q 300 410 230 390 Z" fill="url(#silkFabric)" stroke="#365544" stroke-width="2.5"/>
    
    <!-- V-Neck Collar (Cổ Tim) -->
    <path d="M 240 160 Q 300 240 360 160" fill="none" stroke="#A03F30" stroke-width="4"/>
    
    <!-- Khuy Bướm Bạc (Silver Butterfly Buttons Row) -->
    <g fill="url(#silverShine)" stroke="#365544" stroke-width="1">
      <!-- 7 Silver Butterfly Buttons along center -->
      <path d="M 290 230 Q 300 225 310 230 Q 315 238 310 244 Q 300 240 290 244 Q 285 238 290 230 Z"/>
      <circle cx="300" cy="237" r="3" fill="#D8B454"/>

      <path d="M 290 255 Q 300 250 310 255 Q 315 263 310 269 Q 300 265 290 269 Q 285 263 290 255 Z"/>
      <circle cx="300" cy="262" r="3" fill="#D8B454"/>

      <path d="M 290 280 Q 300 275 310 280 Q 315 288 310 294 Q 300 290 290 294 Q 285 288 290 280 Z"/>
      <circle cx="300" cy="287" r="3" fill="#D8B454"/>

      <path d="M 290 305 Q 300 300 310 305 Q 315 313 310 319 Q 300 315 290 319 Q 285 313 290 305 Z"/>
      <circle cx="300" cy="312" r="3" fill="#D8B454"/>

      <path d="M 290 330 Q 300 325 310 330 Q 315 338 310 344 Q 300 340 290 344 Q 285 338 290 330 Z"/>
      <circle cx="300" cy="337" r="3" fill="#D8B454"/>

      <path d="M 290 355 Q 300 350 310 355 Q 315 363 310 369 Q 300 365 290 369 Q 285 363 290 355 Z"/>
      <circle cx="300" cy="362" r="3" fill="#D8B454"/>
    </g>
    
    <!-- Seam details -->
    <path d="M 300 244 L 300 380" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Editorial Typography Tag -->
  <text x="300" y="520" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#1B1C19" letter-spacing="2">ÁO CÓM CỔ TIM · THÁI TRẮNG</text>
  <text x="300" y="542" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="12" fill="#755B00" letter-spacing="1">HÀNG KHUY BƯỚM BẠC TÂY BẮC</text>
</svg>
