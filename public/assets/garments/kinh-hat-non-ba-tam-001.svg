<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4"/>
      <stop offset="100%" stop-color="#EFECE4"/>
    </linearGradient>
    <radialGradient id="strawGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="70%" stop-color="#E5C378"/>
      <stop offset="100%" stop-color="#C29B47"/>
    </radialGradient>
    <linearGradient id="silkRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B1C19"/>
      <stop offset="50%" stop-color="#3A3D36"/>
      <stop offset="100%" stop-color="#1B1C19"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#hatBg)"/>
  <rect x="20" y="20" width="560" height="560" rx="24" fill="none" stroke="#D8B454" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

  <g transform="translate(0, 20)">
    <!-- Flat Round Rim of Nón Ba Tầm -->
    <ellipse cx="300" cy="280" rx="220" ry="85" fill="url(#strawGrad)" stroke="#755B00" stroke-width="2.5"/>
    <ellipse cx="300" cy="280" rx="195" ry="72" fill="none" stroke="#D8B454" stroke-width="1.5" stroke-dasharray="4 4"/>
    <ellipse cx="300" cy="280" rx="150" ry="55" fill="none" stroke="#755B00" stroke-width="1" opacity="0.7"/>

    <!-- Shallow Crown -->
    <ellipse cx="300" cy="265" rx="80" ry="32" fill="#EAD49B" stroke="#755B00" stroke-width="2"/>
    <circle cx="300" cy="265" r="8" fill="#A03F30"/>

    <!-- Silk Quai Thao Ribbons (Dải Quai Thao buông rủ) -->
    <path d="M 180 290 Q 200 420 220 480" fill="none" stroke="url(#silkRibbon)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 420 290 Q 400 420 380 480" fill="none" stroke="url(#silkRibbon)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Tassels at bottom of Quai Thao -->
    <g fill="#A03F30">
      <circle cx="220" cy="485" r="6"/>
      <path d="M 216 488 L 210 515 L 230 515 L 224 488 Z"/>
      <circle cx="380" cy="485" r="6"/>
      <path d="M 376 488 L 370 515 L 390 515 L 384 488 Z"/>
    </g>
  </g>

  <text x="300" y="540" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#1B1C19" letter-spacing="2">NÓN BA TẦM QUAI THAO · BẮC BỘ</text>
  <text x="300" y="562" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="12" fill="#755B00" letter-spacing="1">DẢI TƠ TẰM ĐEN ĐÍNH TUA ĐỎ</text>
</svg>
